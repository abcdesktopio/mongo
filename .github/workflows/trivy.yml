name: trivy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '33 20 * * 6'

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      security-events: write
      actions: read
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: |
          docker build -t docker.io/my-organization/my-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@7b7aa264d83dc58691451798b4d117d53d21edfe
        with:
          image-ref: 'docker.io/my-organization/my-app:${{ github.sha }}'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      # ----------------------------
      # Ajout : génération du badge
      # ----------------------------

      - name: Run Trivy vulnerability scanner (JSON)
        uses: aquasecurity/trivy-action@0.16.1
        with:
          image-ref: 'docker.io/my-organization/my-app:${{ github.sha }}'
          format: 'json'
          output: 'trivy.json'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Create badge.json
        run: |
          vulns=$(jq '[.Results[].Vulnerabilities[]?] | length' trivy.json)
          crit=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy.json)
          high=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy.json)

          if [ "$vulns" -eq 0 ]; then
            color="brightgreen"
            message="0 vulns"
          elif [ "$crit" -gt 0 ]; then
            color="red"
            message="${crit} critical"
          elif [ "$high" -gt 0 ]; then
            color="orange"
            message="${high} high"
          else
            color="yellow"
            message="${vulns} vulns"
          fi

          mkdir -p public
          cat > public/badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Trivy",
            "message": "$message",
            "color": "$color"
          }
          EOF

      # - name: Deploy badge.json to gh-pages
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: ./public
      #     publish_branch: gh-pages

    - name: Upload badge to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: trivy-badge
        files: ./public/badge.json
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}